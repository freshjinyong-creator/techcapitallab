<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#grad)"/>

  <!-- Upward trending stock chart line (3 segments) -->
  <polyline
    points="28,88 46,72 62,80 100,36"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Arrowhead at the end of the line -->
  <polygon points="100,36 84,40 94,52" fill="#FFFFFF"/>

  <!-- Candlestick bars representing market data -->
  <rect x="26" y="66" width="7" height="24" rx="2" fill="#FFD54F"/>
  <rect x="42" y="54" width="7" height="20" rx="2" fill="#FFD54F"/>
  <rect x="58" y="64" width="7" height="18" rx="2" fill="#FFD54F"/>
  <rect x="74" y="44" width="7" height="16" rx="2" fill="#FFD54F"/>
</svg>
