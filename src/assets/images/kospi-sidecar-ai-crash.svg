<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <circle cx="200" cy="150" r="180" fill="#ef4444" opacity="0.1" filter="blur(60px)" />
  <circle cx="1000" cy="480" r="220" fill="#ef4444" opacity="0.08" filter="blur(70px)" />

  <!-- Header Section -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="220" height="38" rx="8" fill="#ef444425" stroke="#ef4444" stroke-width="1.5" />
    <text x="110" y="25" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" fill="#ef4444" text-anchor="middle">MARKET ALERT</text>
    
    <text x="0" y="85" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">미 국채금리 폭등에 코스피 사이드카 발동: AI 반도체 수혜주 긴급 점검</text>
  </g>

  <!-- 3 Main Big Cards Grid -->
  <g transform="translate(50, 160)">
    <!-- Box 1 -->
    <g transform="translate(0, 0)">
      <rect width="346" height="340" rx="20" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />
      <rect width="346" height="340" rx="20" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.5" />
      
      <text x="25" y="65" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#ef4444">국채금리 폭등</text>
      <text x="25" y="115" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#ffffff">미 10년물 금리 발작</text>
      <line x1="25" y1="140" x2="320" y2="140" stroke="#475569" stroke-width="1.5" />
      
      <!-- Big Subtext -->
      <text x="25" y="195" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">• 글로벌 증시 유동성 쇼크</text>
      <text x="25" y="240" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#94a3b8">• 핵심 지표 정밀 점검</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(376, 0)">
      <rect width="346" height="340" rx="20" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />
      <rect width="346" height="340" rx="20" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5" />
      
      <text x="25" y="65" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#fbbf24">사이드카 발동</text>
      <text x="25" y="115" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#ffffff">코스피 장중 급락</text>
      <line x1="25" y1="140" x2="320" y2="140" stroke="#475569" stroke-width="1.5" />
      
      <text x="25" y="195" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">• 변동성 확대로 일시 정지</text>
      <text x="25" y="240" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#94a3b8">• 산업 생태계 영향 분석</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(752, 0)">
      <rect width="346" height="340" rx="20" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />
      <rect width="346" height="340" rx="20" fill="none" stroke="#34d399" stroke-width="2" opacity="0.5" />
      
      <text x="25" y="65" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#34d399">저가 매수</text>
      <text x="25" y="115" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#ffffff">AI 반도체 수혜주</text>
      <line x1="25" y1="140" x2="320" y2="140" stroke="#475569" stroke-width="1.5" />
      
      <text x="25" y="195" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">• 실적 대비 과도한 패닉 매도</text>
      <text x="25" y="240" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#94a3b8">• 가치투자 실전 포인트</text>
    </g>
  </g>

  <!-- Bottom Summary Banner -->
  <g transform="translate(50, 530)">
    <rect width="1100" height="95" rx="16" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />
    <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="22" font-weight="800" fill="#ef4444">💡 핵심 요약:</text>
    <text x="170" y="55" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">매크로 쇼크로 인한 패닉 투매는 실적이 확실한 AI 핵심 반도체주를 저가 매수할 기회입니다.</text>
  </g>

  <text x="1150" y="655" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="end">TechCapitalLab Financial Research</text>
</svg>