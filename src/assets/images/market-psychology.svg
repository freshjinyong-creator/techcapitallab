<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <circle cx="200" cy="150" r="200" fill="#34d399" opacity="0.15" filter="blur(70px)" />
  <circle cx="1000" cy="480" r="240" fill="#34d399" opacity="0.12" filter="blur(80px)" />

  <!-- Header Section -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="240" height="42" rx="10" fill="#34d39933" stroke="#34d399" stroke-width="2" />
    <text x="120" y="28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" fill="#34d399" text-anchor="middle">ECONOMY BASICS</text>
    
    <text x="0" y="90" font-family="'Pretendard', sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-1">4강. 시장의 심리학: 공포와 탐욕, 3대 심리 함정 탈출</text>
  </g>

  <!-- 3 Big Cards Grid -->
  <g transform="translate(40, 150)">
    <!-- Box 1 -->
    <g transform="translate(0, 0)">
      <rect width="354" height="345" rx="24" fill="url(#cardGrad)" stroke="#475569" stroke-width="2.5" />
      <rect width="354" height="345" rx="24" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.7" />
      
      <text x="25" y="70" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#34d399">손실 회피</text>
      <text x="25" y="125" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#ffffff">1. 손실회피 편향</text>
      <line x1="25" y1="150" x2="330" y2="150" stroke="#475569" stroke-width="2" />
      
      <text x="25" y="210" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#f1f5f9">• 손실 공포가 이익의 2배</text>
      <text x="25" y="260" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#94a3b8">• 핵심 지표 정밀 분석</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(384, 0)">
      <rect width="354" height="345" rx="24" fill="url(#cardGrad)" stroke="#475569" stroke-width="2.5" />
      <rect width="354" height="345" rx="24" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.7" />
      
      <text x="25" y="70" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#fbbf24">FOMO 탐욕</text>
      <text x="25" y="125" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#ffffff">2. 군중 심리와 FOMO</text>
      <line x1="25" y1="150" x2="330" y2="150" stroke="#475569" stroke-width="2" />
      
      <text x="25" y="210" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#f1f5f9">• 상투 매수 &amp; 바닥 손절</text>
      <text x="25" y="260" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#94a3b8">• 산업 생태계 영향 점검</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(768, 0)">
      <rect width="354" height="345" rx="24" fill="url(#cardGrad)" stroke="#475569" stroke-width="2.5" />
      <rect width="354" height="345" rx="24" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.7" />
      
      <text x="25" y="70" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#34d399">확증 편향</text>
      <text x="25" y="125" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#ffffff">3. 확증 편향</text>
      <line x1="25" y1="150" x2="330" y2="150" stroke="#475569" stroke-width="2" />
      
      <text x="25" y="210" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#f1f5f9">• 유리한 뉴스만 맹신</text>
      <text x="25" y="260" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#94a3b8">• 가치투자 실전 전략</text>
    </g>
  </g>

  <!-- Bottom Summary Banner -->
  <g transform="translate(40, 520)">
    <rect width="1120" height="110" rx="20" fill="rgba(15, 23, 42, 0.98)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
    <text x="35" y="65" font-family="'Pretendard', sans-serif" font-size="26" font-weight="900" fill="#34d399">💡 핵심 요약:</text>
    <text x="185" y="65" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#ffffff">투자의 가장 큰 적은 외부 시장이 아니라 내 안의 심리적 편향입니다.</text>
  </g>

  <text x="1160" y="658" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" fill="#64748b" text-anchor="end">TechCapitalLab Financial Research</text>
</svg>