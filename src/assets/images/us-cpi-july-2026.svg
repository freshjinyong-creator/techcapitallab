<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.08" filter="blur(60px)" />
  <circle cx="1000" cy="480" r="220" fill="#38bdf8" opacity="0.06" filter="blur(70px)" />

  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="200" height="32" rx="6" fill="#38bdf822" stroke="#38bdf866" stroke-width="1" />
    <text x="100" y="21" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">GLOBAL INFLATION</text>
    
    <text x="0" y="75" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.5">2026년 7월 미국 CPI 3.4% 발표: 연준 금리 인하 신호 분석</text>
    <text x="0" y="105" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#94a3b8">US July 2026 CPI 3.4% &amp; Fed Interest Rate Cut Signal Analysis</text>
  </g>

  <g transform="translate(60, 190)">
    <g transform="translate(0, 0)">
      <rect width="340" height="280" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="340" height="280" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
      
      <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#38bdf8">CPI 3.4%</text>
      <text x="30" y="100" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">7월 물가지수 발표</text>
      <line x1="30" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1" />
      <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">• 시장 예상치 부합 및 지속 안치</text>
      <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">• 핵심 지표 &amp; 모멘텀 분석</text>
    </g>

    <g transform="translate(370, 0)">
      <rect width="340" height="280" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="340" height="280" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
      
      <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#fbbf24">금리 인하</text>
      <text x="30" y="100" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">연준 피벗 가시화</text>
      <line x1="30" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1" />
      <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">• 9월 통화정책 금리 인하 유력</text>
      <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">• 매크로 &amp; 산업 생태계 영향</text>
    </g>

    <g transform="translate(740, 0)">
      <rect width="340" height="280" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="340" height="280" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
      
      <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#34d399">자산 시장</text>
      <text x="30" y="100" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">유동성 공급 기대</text>
      <line x1="30" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1" />
      <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">• 성장주 &amp; 기술주 밸류에이션 리레이팅</text>
      <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">• 가치투자 관점의 시사점</text>
    </g>
  </g>

  <g transform="translate(60, 500)">
    <rect width="1080" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="30" y="42" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#38bdf8">💡 핵심 인사이트:</text>
    <text x="170" y="42" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#e2e8f0">미국 물가 지표 안착은 긴축 종료와 글로벌 자산 시장의 온기 확산을 의미합니다.</text>
  </g>

  <text x="1140" y="605" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">TechCapitalLab Financial Research</text>
</svg>