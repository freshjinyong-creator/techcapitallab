<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <circle cx="200" cy="150" r="200" fill="#38bdf8" opacity="0.15" filter="blur(70px)" />
  <circle cx="1000" cy="480" r="240" fill="#38bdf8" opacity="0.12" filter="blur(80px)" />

  <!-- Header Section -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="240" height="42" rx="10" fill="#38bdf833" stroke="#38bdf8" stroke-width="2" />
    <text x="120" y="28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle">GLOBAL INFLATION</text>
    
    <text x="0" y="90" font-family="'Pretendard', sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-1">2026년 7월 미국 CPI 3.4% 발표: 연준 금리 인하 신호</text>
  </g>

  <!-- 3 Big Cards Grid -->
  <g transform="translate(40, 150)">
    <!-- Box 1 -->
    <g transform="translate(0, 0)">
      <rect width="354" height="345" rx="24" fill="url(#cardGrad)" stroke="#475569" stroke-width="2.5" />
      <rect width="354" height="345" rx="24" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" />
      
      <text x="25" y="70" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#38bdf8">CPI 3.4%</text>
      <text x="25" y="125" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#ffffff">7월 소비자물가</text>
      <line x1="25" y1="150" x2="330" y2="150" stroke="#475569" stroke-width="2" />
      
      <text x="25" y="210" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#f1f5f9">• 시장 예상치 완벽 부합</text>
      <text x="25" y="260" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#94a3b8">• 핵심 지표 정밀 분석</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(384, 0)">
      <rect width="354" height="345" rx="24" fill="url(#cardGrad)" stroke="#475569" stroke-width="2.5" />
      <rect width="354" height="345" rx="24" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.7" />
      
      <text x="25" y="70" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#fbbf24">금리 인하</text>
      <text x="25" y="125" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#ffffff">연준 피벗 기대</text>
      <line x1="25" y1="150" x2="330" y2="150" stroke="#475569" stroke-width="2" />
      
      <text x="25" y="210" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#f1f5f9">• 9월 인하 신호 가시화</text>
      <text x="25" y="260" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#94a3b8">• 산업 생태계 영향 점검</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(768, 0)">
      <rect width="354" height="345" rx="24" fill="url(#cardGrad)" stroke="#475569" stroke-width="2.5" />
      <rect width="354" height="345" rx="24" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.7" />
      
      <text x="25" y="70" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#34d399">자산 시장</text>
      <text x="25" y="125" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#ffffff">유동성 공급 확대</text>
      <line x1="25" y1="150" x2="330" y2="150" stroke="#475569" stroke-width="2" />
      
      <text x="25" y="210" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#f1f5f9">• 성장주 밸류 리레이팅</text>
      <text x="25" y="260" font-family="'Pretendard', sans-serif" font-size="22" font-weight="700" fill="#94a3b8">• 가치투자 실전 전략</text>
    </g>
  </g>

  <!-- Bottom Summary Banner -->
  <g transform="translate(40, 520)">
    <rect width="1120" height="110" rx="20" fill="rgba(15, 23, 42, 0.98)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
    <text x="35" y="65" font-family="'Pretendard', sans-serif" font-size="26" font-weight="900" fill="#38bdf8">💡 핵심 요약:</text>
    <text x="185" y="65" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#ffffff">미국 물가 지표 안착은 긴축 종료와 글로벌 자산 시장의 온기 확산을 의미합니다.</text>
  </g>

  <text x="1160" y="658" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" fill="#64748b" text-anchor="end">TechCapitalLab Financial Research</text>
</svg>