<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.08" filter="blur(60px)" />
  <circle cx="1000" cy="480" r="220" fill="#38bdf8" opacity="0.06" filter="blur(70px)" />

  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="200" height="32" rx="6" fill="#38bdf822" stroke="#38bdf866" stroke-width="1" />
    <text x="100" y="21" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">SEMICONDUCTOR INDUSTRY</text>
    
    <text x="0" y="75" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.5">삼성전자·SK하이닉스 역대급 실적과 반도체 쏠림 현상의 명과 암</text>
    <text x="0" y="105" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#94a3b8">Samsung &amp; SK Hynix Record Earnings &amp; Market Concentration</text>
  </g>

  <g transform="translate(60, 190)">
    <g transform="translate(0, 0)">
      <rect width="340" height="280" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="340" height="280" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
      
      <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#38bdf8">역대급 실적</text>
      <text x="30" y="100" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">HBM·서버 D램 호황</text>
      <line x1="30" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1" />
      <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">• 영업이익 사상 최대 경신</text>
      <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">• 핵심 지표 &amp; 모멘텀 분석</text>
    </g>

    <g transform="translate(370, 0)">
      <rect width="340" height="280" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="340" height="280" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
      
      <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#fbbf24">쏠림 현상</text>
      <text x="30" y="100" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">코스피 이익 60% 독점</text>
      <line x1="30" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1" />
      <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">• 반도체 제외 시 상장사 이익 정체</text>
      <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">• 매크로 &amp; 산업 생태계 영향</text>
    </g>

    <g transform="translate(740, 0)">
      <rect width="340" height="280" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="340" height="280" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
      
      <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#34d399">밸류체인</text>
      <text x="30" y="100" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">소부장 동반 성장</text>
      <line x1="30" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1" />
      <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">• 국산화 성공 핵심 소부장 수혜</text>
      <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">• 가치투자 관점의 시사점</text>
    </g>
  </g>

  <g transform="translate(60, 500)">
    <rect width="1080" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="30" y="42" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#38bdf8">💡 핵심 인사이트:</text>
    <text x="170" y="42" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#e2e8f0">반도체 착시 속에서 소부장 밸류체인의 진짜 알짜 수혜 기업을 가려내는 안목이 필요합니다.</text>
  </g>

  <text x="1140" y="605" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">TechCapitalLab Financial Research</text>
</svg>