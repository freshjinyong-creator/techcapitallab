<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="200" cy="150" r="180" fill="#34d399" opacity="0.08" filter="blur(60px)" />
  <circle cx="1000" cy="480" r="220" fill="#34d399" opacity="0.06" filter="blur(70px)" />

  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="200" height="32" rx="6" fill="#34d39922" stroke="#34d39966" stroke-width="1" />
    <text x="100" y="21" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">VALUE INVESTING</text>
    
    <text x="0" y="75" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.5">5강. 워렌 버핏부터 이세옥까지: 성공 투자를 완성하는 가치투자 5계명</text>
    <text x="0" y="105" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#94a3b8">Five Essential Principles of Value Investing Mastery</text>
  </g>

  <g transform="translate(60, 190)">
    <g transform="translate(0, 0)">
      <rect width="340" height="280" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="340" height="280" rx="16" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.3" />
      
      <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#34d399">안전지대</text>
      <text x="30" y="100" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">1. 안전마진 확보</text>
      <line x1="30" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1" />
      <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">• 내재가치 대비 싸게 매수</text>
      <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">• 핵심 지표 &amp; 모멘텀 분석</text>
    </g>

    <g transform="translate(370, 0)">
      <rect width="340" height="280" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="340" height="280" rx="16" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.3" />
      
      <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#fbbf24">비즈니스</text>
      <text x="30" y="100" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">2. 경제적 해자</text>
      <line x1="30" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1" />
      <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">• 독점력과 독보적 경쟁우위</text>
      <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">• 매크로 &amp; 산업 생태계 영향</text>
    </g>

    <g transform="translate(740, 0)">
      <rect width="340" height="280" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="340" height="280" rx="16" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.3" />
      
      <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#34d399">장기복리</text>
      <text x="30" y="100" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">3. 동업자 정신</text>
      <line x1="30" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1" />
      <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">• 기업과 함께 동반 성장</text>
      <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">• 가치투자 관점의 시사점</text>
    </g>
  </g>

  <g transform="translate(60, 500)">
    <rect width="1080" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="30" y="42" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#34d399">💡 핵심 인사이트:</text>
    <text x="170" y="42" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#e2e8f0">시장의 단기 소음에 흔들리지 않고 기업의 본질 가치에 집중하는 것이 가치투자의 핵심입니다.</text>
  </g>

  <text x="1140" y="605" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">TechCapitalLab Financial Research</text>
</svg>