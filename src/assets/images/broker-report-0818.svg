<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="200" cy="150" r="180" fill="#a855f7" opacity="0.08" filter="blur(60px)" />
  <circle cx="1000" cy="480" r="220" fill="#a855f7" opacity="0.06" filter="blur(70px)" />

  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="200" height="32" rx="6" fill="#a855f722" stroke="#a855f766" stroke-width="1" />
    <text x="100" y="21" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#a855f7" text-anchor="middle">EQUITY RESEARCH</text>
    
    <text x="0" y="75" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.5">8월 18일 증권사 리포트: MLCC 품귀 &amp; 우주항공·BESS 수혜주</text>
    <text x="0" y="105" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#94a3b8">MLCC Shortage, LEO Satellite &amp; Energy Infrastructure</text>
  </g>

  <g transform="translate(60, 190)">
    <g transform="translate(0, 0)">
      <rect width="340" height="280" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="340" height="280" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3" />
      
      <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#a855f7">MLCC 품귀</text>
      <text x="30" y="100" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">리드타임 21주 돌파</text>
      <line x1="30" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1" />
      <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">• AI 서버용 MLCC 슈퍼사이클</text>
      <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">• 핵심 지표 &amp; 모멘텀 분석</text>
    </g>

    <g transform="translate(370, 0)">
      <rect width="340" height="280" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="340" height="280" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3" />
      
      <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#fbbf24">우주항공/LEO</text>
      <text x="30" y="100" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">저궤도 위성 통신</text>
      <line x1="30" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1" />
      <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">• 인텔리안테크 수주 본격화</text>
      <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">• 매크로 &amp; 산업 생태계 영향</text>
    </g>

    <g transform="translate(740, 0)">
      <rect width="340" height="280" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="340" height="280" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3" />
      
      <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#34d399">BESS/에너지</text>
      <text x="30" y="100" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">전력 인프라 확충</text>
      <line x1="30" y1="120" x2="310" y2="120" stroke="#334155" stroke-width="1" />
      <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">• 비에이치아이, 삼양식품</text>
