<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <circle cx="200" cy="150" r="180" fill="#a855f7" opacity="0.1" filter="blur(60px)" />
  <circle cx="1000" cy="480" r="220" fill="#a855f7" opacity="0.08" filter="blur(70px)" />

  <!-- Header Section -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="220" height="38" rx="8" fill="#a855f725" stroke="#a855f7" stroke-width="1.5" />
    <text x="110" y="25" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" fill="#a855f7" text-anchor="middle">EQUITY RESEARCH</text>
    
    <text x="0" y="85" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">8월 18일 증권사 리포트: MLCC 품귀 &amp; 우주항공·BESS 수혜주</text>
  </g>

  <!-- 3 Main Big Cards Grid -->
  <g transform="translate(50, 160)">
    <!-- Box 1 -->
    <g transform="translate(0, 0)">
      <rect width="346" height="340" rx="20" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />
      <rect width="346" height="340" rx="20" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5" />
      
      <text x="25" y="65" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#a855f7">MLCC 품귀</text>
      <text x="25" y="115" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#ffffff">리드타임 21주 돌파</text>
      <line x1="25" y1="140" x2="320" y2="140" stroke="#475569" stroke-width="1.5" />
      
      <!-- Big Subtext -->
      <text x="25" y="195" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">• AI 서버용 MLCC 슈퍼사이클</text>
      <text x="25" y="240" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#94a3b8">• 핵심 지표 정밀 점검</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(376, 0)">
      <rect width="346" height="340" rx="20" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />
      <rect width="346" height="340" rx="20" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5" />
      
      <text x="25" y="65" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#fbbf24">우주항공/LEO</text>
      <text x="25" y="115" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#ffffff">저궤도 위성 통신</text>
      <line x1="25" y1="140" x2="320" y2="140" stroke="#475569" stroke-width="1.5" />
      
      <text x="25" y="195" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">• 인텔리안테크 수주 본격화</text>
      <text x="25" y="240" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#94a3b8">• 산업 생태계 영향 분석</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(752, 0)">
      <rect width="346" height="340" rx="20" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />
      <rect width="346" height="340" rx="20" fill="none" stroke="#34d399" stroke-width="2" opacity="0.5" />
      
      <text x="25" y="65" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#34d399">BESS/에너지</text>
      <text x="25" y="115" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#ffffff">전력 인프라 확충</text>
      <line x1="25" y1="140" x2="320" y2="140" stroke="#475569" stroke-width="1.5" />
      
      <text x="25" y="195" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">• 비에이치아이, 삼양식품</text>
      <text x="25" y="240" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#94a3b8">• 가치투자 실전 포인트</text>
    </g>
  </g>

  <!-- Bottom Summary Banner -->
  <g transform="translate(50, 530)">
    <rect width="1100" height="95" rx="16" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />
    <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="22" font-weight="800" fill="#a855f7">💡 핵심 요약:</text>
    <text x="170" y="55" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">AI 전력 인프라 및 우주항공 공급망 등 글로벌 구조적 성장에 직결된 알짜 기업 수혜주 분석.</text>
  </g>

  <text x="1150" y="655" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="end">TechCapitalLab Financial Research</text>
</svg>