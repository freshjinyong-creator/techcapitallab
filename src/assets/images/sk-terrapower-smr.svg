<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.1" filter="blur(60px)" />
  <circle cx="1000" cy="480" r="220" fill="#38bdf8" opacity="0.08" filter="blur(70px)" />

  <!-- Header Section -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="220" height="38" rx="8" fill="#38bdf825" stroke="#38bdf8" stroke-width="1.5" />
    <text x="110" y="25" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle">GREEN ENERGY &amp; SMR</text>
    
    <text x="0" y="85" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">차세대 SMR 시장 여는 SK이노베이션: 테라파워 나트륨 원전 동맹</text>
  </g>

  <!-- 3 Main Big Cards Grid -->
  <g transform="translate(50, 160)">
    <!-- Box 1 -->
    <g transform="translate(0, 0)">
      <rect width="346" height="340" rx="20" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />
      <rect width="346" height="340" rx="20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
      
      <text x="25" y="65" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#38bdf8">SMR 동맹</text>
      <text x="25" y="115" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#ffffff">테라파워 지분 투자</text>
      <line x1="25" y1="140" x2="320" y2="140" stroke="#475569" stroke-width="1.5" />
      
      <!-- Big Subtext -->
      <text x="25" y="195" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">• 차세대 나트륨 원전 사업권</text>
      <text x="25" y="240" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#94a3b8">• 핵심 지표 정밀 점검</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(376, 0)">
      <rect width="346" height="340" rx="20" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />
      <rect width="346" height="340" rx="20" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5" />
      
      <text x="25" y="65" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#fbbf24">에너지 전환</text>
      <text x="25" y="115" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#ffffff">친환경 에너제틱 포트</text>
      <line x1="25" y1="140" x2="320" y2="140" stroke="#475569" stroke-width="1.5" />
      
      <text x="25" y="195" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">• 정유 중심에서 무탄소 에너지로</text>
      <text x="25" y="240" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#94a3b8">• 산업 생태계 영향 분석</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(752, 0)">
      <rect width="346" height="340" rx="20" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />
      <rect width="346" height="340" rx="20" fill="none" stroke="#34d399" stroke-width="2" opacity="0.5" />
      
      <text x="25" y="65" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#34d399">AI 전력망</text>
      <text x="25" y="115" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#ffffff">글로벌 SMR 시장 선점</text>
      <line x1="25" y1="140" x2="320" y2="140" stroke="#475569" stroke-width="1.5" />
      
      <text x="25" y="195" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">• 북미/아시아 AI 데이터센터 전력</text>
      <text x="25" y="240" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600" fill="#94a3b8">• 가치투자 실전 포인트</text>
    </g>
  </g>

  <!-- Bottom Summary Banner -->
  <g transform="translate(50, 530)">
    <rect width="1100" height="95" rx="16" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />
    <text x="30" y="55" font-family="'Pretendard', sans-serif" font-size="22" font-weight="800" fill="#38bdf8">💡 핵심 요약:</text>
    <text x="170" y="55" font-family="'Pretendard', sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">전력 굶주림에 직면한 AI 데이터센터 시장에 무탄소 SMR 전력 공급망 파트너십이 본격화됩니다.</text>
  </g>

  <text x="1150" y="655" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="end">TechCapitalLab Financial Research</text>
</svg>