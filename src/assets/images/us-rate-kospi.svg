<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="usCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    
    <linearGradient id="krCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="250" cy="150" r="180" fill="#38bdf8" opacity="0.08" filter="blur(50px)" />
  <circle cx="950" cy="450" r="200" fill="#f43f5e" opacity="0.08" filter="blur(60px)" />

  <!-- Header Section -->
  <g transform="translate(60, 50)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="160" height="32" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="80" y="21" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">FINANCIAL MACRO</text>
    
    <!-- Title -->
    <text x="0" y="75" font-family="'Pretendard', sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.5">미국 금리 인상과 한국 증시 하락 메커니즘</text>
    <text x="0" y="105" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#94a3b8">US Fed Rate Hikes &amp; KOSPI Capital Outflow Mechanism</text>
  </g>

  <!-- Main Flow Diagram Grid -->
  <!-- Step 1: US Fed Rate Hike -->
  <g transform="translate(60, 190)">
    <rect width="320" height="280" rx="16" fill="url(#usCardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="320" height="280" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
    
    <circle cx="50" cy="50" r="22" fill="rgba(56, 189, 248, 0.2)" />
    <text x="50" y="56" font-family="'Pretendard', sans-serif" font-size="18" font-weight="800" fill="#38bdf8" text-anchor="middle">1</text>
    <text x="85" y="56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">미국 연준 금리 인상</text>
    
    <path d="M 40 120 L 80 80 L 120 110 L 180 60 L 220 90 L 280 40" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glowBlue)" />
    
    <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">• 미국 기준금리 상승 (달러 자산 매력↑)</text>
    <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">• 글로벌 유동성 축소 &amp; 달러 강세</text>
    <text x="30" y="230" font-family="'Pretendard', sans-serif" font-size="15" font-weight="600" fill="#38bdf8">• 한·미 금리 역전 폭 확대</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(400, 310)">
    <path d="M 0 0 L 35 0" stroke="#64748b" stroke-width="3" stroke-dasharray="6,4" />
    <polygon points="35,-6 48,0 35,6" fill="#38bdf8" />
    <text x="24" y="-15" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">환차손 우려</text>
  </g>

  <!-- Step 2: Exchange Rate & FX Market -->
  <g transform="translate(460, 190)">
    <rect width="320" height="280" rx="16" fill="url(#usCardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="320" height="280" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4" />

    <circle cx="50" cy="50" r="22" fill="rgba(251, 191, 36, 0.2)" />
    <text x="50" y="56" font-family="'Pretendard', sans-serif" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="middle">2</text>
    <text x="85" y="56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">원/달러 환율 급등</text>

    <!-- Currency Exchange Graphic -->
    <text x="160" y="115" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#fbbf24" text-anchor="middle">USD/KRW ⬆</text>

    <text x="30" y="160" font-family="'Pretendard', sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">• 원화 가치 하락 (원화 약세)</text>
    <text x="30" y="195" font-family="'Pretendard', sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">• 외국인 환차손 회피 자금 이탈</text>
    <text x="30" y="230" font-family="'Pretendard', sans-serif" font-size="15" font-weight="600" fill="#fbbf24">• 수입 물가 상승 &amp; 기업 비용 부담</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(800, 310)">
    <path d="M 0 0 L 35 0" stroke="#64748b" stroke-width="3" stroke-dasharray="6,4" />
    <polygon points="35,-6 48,0 35,6" fill="#f43f5e" />
    <text x="24" y="-15" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">외인 순매도</text>
  </g>

  <!-- Step 3: KOSPI Fall -->
  <g transform="translate(860, 190)">
    <rect width="280" height="280" rx="16" fill="url(#krCardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="280" height="280" rx="16" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.5" />

    <circle cx="45" cy="50" r="22" fill="rgba(244, 63, 94, 0.2)" />
    <text x="45" y="56" font-family="'Pretendard', sans-serif" font-size="18" font-weight="800" fill="#f43f5e" text-anchor="middle">3</text>
    <text x="80" y="56" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">코스피 지수 하락</text>

    <path d="M 30 70 L 80 90 L 130 110 L 180 150 L 240 160" fill="none" stroke="#f43f5e" stroke-width="3" filter="url(#glowRed)" />

    <text x="25" y="195" font-family="'Pretendard', sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">• 외국인 순매도 압력 가중</text>
    <text x="25" y="230" font-family="'Pretendard', sans-serif" font-size="15" font-weight="600" fill="#f43f5e">• 우량주 내재가치 대비 과매도 발생</text>
  </g>

  <!-- Bottom Summary Banner -->
  <g transform="translate(60, 500)">
    <rect width="1080" height="70" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="30" y="42" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#38bdf8">💡 가치투자 포인트:</text>
    <text x="170" y="42" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#e2e8f0">매크로 악재로 인한 수급 이탈 시, 펀더멘털이 견고한 우량 기업을 저가 분할 매수하는 역발상 기회로 활용합니다.</text>
  </g>

  <!-- Footer Watermark -->
  <text x="1140" y="605" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">TechCapitalLab Financial Insights</text>
</svg>
