<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <linearGradient id="usCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>
    
    <linearGradient id="krCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <circle cx="200" cy="150" r="200" fill="#38bdf8" opacity="0.15" filter="blur(70px)" />
  <circle cx="1000" cy="480" r="240" fill="#f43f5e" opacity="0.12" filter="blur(80px)" />

  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="240" height="42" rx="10" fill="rgba(56, 189, 248, 0.3)" stroke="#38bdf8" stroke-width="2" />
    <text x="120" y="28" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle">FINANCIAL MACRO</text>
    
    <text x="0" y="90" font-family="'Pretendard', sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-1">미국 금리 인상과 한국 증시 하락 메커니즘</text>
  </g>

  <g transform="translate(40, 150)">
    <!-- Box 1 -->
    <g transform="translate(0, 0)">
      <rect width="354" height="345" rx="24" fill="url(#usCardGrad)" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="55" cy="55" r="28" fill="rgba(56, 189, 248, 0.3)" />
      <text x="55" y="65" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#38bdf8" text-anchor="middle">1</text>
      <text x="98" y="65" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#ffffff">미국 금리 인상</text>
      <line x1="25" y1="100" x2="330" y2="100" stroke="#475569" stroke-width="2" />
      
      <text x="25" y="160" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#ffffff">• 달러 자산 매력 급증</text>
      <text x="25" y="215" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#ffffff">• 한·미 금리 역전 확대</text>
      <text x="25" y="270" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#38bdf8">• 글로벌 유동성 축소</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(384, 0)">
      <rect width="354" height="345" rx="24" fill="url(#usCardGrad)" stroke="#fbbf24" stroke-width="2.5" />
      <circle cx="55" cy="55" r="28" fill="rgba(251, 191, 36, 0.3)" />
      <text x="55" y="65" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#fbbf24" text-anchor="middle">2</text>
      <text x="98" y="65" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#ffffff">원/달러 환율 급등</text>
      <line x1="25" y1="100" x2="330" y2="100" stroke="#475569" stroke-width="2" />
      
      <text x="25" y="160" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#ffffff">• 원화 가치 급락 (약세)</text>
      <text x="25" y="215" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#ffffff">• 외인 환차손 탈출</text>
      <text x="25" y="270" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#fbbf24">• 수입 물가 부담 가중</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(768, 0)">
      <rect width="354" height="345" rx="24" fill="url(#krCardGrad)" stroke="#f43f5e" stroke-width="2.5" />
      <circle cx="55" cy="55" r="28" fill="rgba(244, 63, 94, 0.3)" />
      <text x="55" y="65" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#f43f5e" text-anchor="middle">3</text>
      <text x="98" y="65" font-family="'Pretendard', sans-serif" font-size="30" font-weight="900" fill="#ffffff">코스피 지수 하락</text>
      <line x1="25" y1="100" x2="330" y2="100" stroke="#475569" stroke-width="2" />
      
      <text x="25" y="160" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#ffffff">• 외국인 대량 순매도</text>
      <text x="25" y="215" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#ffffff">• 대형 수출주 동반 하락</text>
      <text x="25" y="270" font-family="'Pretendard', sans-serif" font-size="26" font-weight="800" fill="#f43f5e">• 우량주 과매도 발생</text>
    </g>
  </g>

  <!-- Bottom Summary Banner -->
  <g transform="translate(40, 520)">
    <rect width="1120" height="110" rx="20" fill="rgba(15, 23, 42, 0.98)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
    <text x="35" y="65" font-family="'Pretendard', sans-serif" font-size="26" font-weight="900" fill="#38bdf8">💡 가치투자 포인트:</text>
    <text x="220" y="65" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#ffffff">환율 충격으로 인한 수급 이탈 시, 펀더멘털 우량주를 저가 분할 매수합니다.</text>
  </g>

  <text x="1160" y="658" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" fill="#64748b" text-anchor="end">TechCapitalLab Financial Research</text>
</svg>